project_name: data_enrich
description: TS (Teacher-Student) ensemble data augmentation for few-shot learning on
  CIFAR-100 (CIFAR-FS style 20-class k-shot benchmark); AutoResearch searches the
  augmentation pipeline and maximizes downstream ProtoNet validation accuracy
goal: Maximize validation accuracy of a prototypical-network classifier trained on
  a TS-augmented few-shot CIFAR-100 dataset (5/10-shot seed grown to 40/60 shots
  per class by teacher-scored student generators)
target_metric: val_acc
direction: higher
constraint:
  max_time_seconds: 900
  max_iterations: 50
  metric_direction: higher
  metric_name: val_acc
  metric_threshold: null
search_space:
  shots:
  - 5
  - 10
  target_shots:
  - 40
  - 60
  n_students:
  - 2
  - 3
  - 4
  teacher_weights:
  - 2.0
  - 3.0
  - 5.0
  score_thresholds:
  - 0.5
  - 0.6
  - 0.7
  aug_iters:
  - 3
  - 4
  - 6
  candidates_per_source:
  - 4
  - 8
  student_channels:
  - 32
  - 64
  latent_dims:
  - 8
  - 16
  teacher_lrs:
  - 0.001
  - 0.003
  student_lrs:
  - 0.001
  - 0.003
  student_styles:
  - jitter
  - warp
  - mixed
  retrain_students:
  - 0
  - 1
experiment_file: experiments/ts_aug_experiment.py
results_file: results/results.tsv
paper_output: papers/generated_paper.md
git_branch: autoresearch/experiment
research_phases:
- seed_setup
- pipeline_search
- scoring_ensemble
- selection_threshold
- augmentation_schedule
paper_settings:
  title_prefix: 'TS-Aug: Teacher-Student Ensemble Data Augmentation for Few-Shot Learning'
  include_ablation: true
  include_analysis: true
  format: ieee
