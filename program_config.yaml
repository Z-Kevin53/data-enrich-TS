project_name: data_enrich
description: Data enrichment strategy optimization on UCI Spambase (find the
  augmentation that maximizes downstream val_acc from a small labeled seed)
goal: Maximize validation accuracy of a small MLP by enriching a seed subset
  of labeled spambase emails with synthetic/oversampled/noisy samples
target_metric: val_acc
direction: higher
constraint:
  max_time_seconds: 600
  max_iterations: 50
  metric_direction: higher
  metric_name: val_acc
  metric_threshold: null
search_space:
  enrich_methods:
  - none
  - synthetic
  - oversample
  - noise
  - hybrid
  seed_ratios:
  - 0.15
  - 0.25
  - 0.35
  - 0.5
  enrich_ratios:
  - 0.5
  - 1.0
  - 2.0
  noise_stds:
  - 0.05
  - 0.1
  - 0.2
  learning_rates:
  - 0.001
  - 0.005
  - 0.01
  batch_sizes:
  - 16
  - 32
  - 64
  hidden_dims:
  - 32
  - 64
  - 128
  dropout_rates:
  - 0.0
  - 0.1
  - 0.3
  optimizer_types:
  - adam
  - adamw
  - sgd
  weight_decay:
  - 0.0
  - 0.001
  - 0.01
experiment_file: experiments/enrich_experiment.py
results_file: results/results.tsv
paper_output: papers/generated_paper.md
git_branch: autoresearch/experiment
research_phases:
- seed_setup
- enrichment_search
- hyperparameter
- regularization
- optimization
paper_settings:
  title_prefix: 'AutoResearch: Data Enrichment'
  include_ablation: true
  include_analysis: true
  format: markdown